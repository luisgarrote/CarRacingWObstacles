name: Environment and wheel checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip "setuptools>=68,<74" wheel swig
      - run: python -m pip install --no-build-isolation -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Import the installed wheel outside the checkout
        run: |
          cd "${{ runner.temp }}"
          python -c "import car_racing_obstacles, gymnasium as gym; e=gym.make('CarRacingObstacles-v3', render_mode='rgb_array'); o,_=e.reset(seed=123); assert o.shape==(96,96,3); e.close()"
  sb3:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "setuptools>=68,<74" wheel swig
      - run: python -m pip install --no-build-isolation -r requirements.txt
      - run: python -m pip install ".[sb3]"
      - run: python examples/train_ppo.py --steps 128 --rollout 64 --batch-size 32 --epochs 1 --max-steps 16 --output outputs/ci
      - run: python examples/plot_rewards.py --log outputs/ci/training.monitor.csv --output outputs/ci/replotted.png
      - run: python examples/run_model.py --run outputs/ci --case normal_1 --max-steps 8
      - run: python examples/evaluate.py --run outputs/ci --max-steps 8
      - run: python examples/record_video.py --run outputs/ci --case randomized_1 --max-steps 8 --output outputs/ci/demo.mp4
      - run: python examples/train_ppo.py --episodes 12 --history 4 --action-repeat 3 --rollout 32 --batch-size 16 --epochs 1 --max-steps 16 --output outputs/persistent
      - run: python examples/run_model.py --run outputs/persistent --case normal_1 --max-steps 8
      - run: python examples/record_video.py --run outputs/persistent --case normal_1 --max-steps 8 --output outputs/persistent/demo.mp4
      - run: python examples/train_dqn.py --episodes 12 --history 4 --action-repeat 3 --max-steps 16 --buffer-size 128 --batch-size 16 --learning-starts 16 --output outputs/dqn
      - run: python examples/run_model.py --run outputs/dqn --case normal_1 --max-steps 8
      - run: python examples/record_video.py --run outputs/dqn --case normal_1 --max-steps 8 --output outputs/dqn/demo.mp4
      - run: python -m pip install nbformat nbclient ipykernel
      - run: python examples/check_notebook.py
  legacy-build-tools:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Simulate an existing scientific Python environment
        run: python -m pip install --upgrade pip "numpy==1.23.5" "Cython==3.0.12" setuptools wheel swig
      - name: Apply the documented build-tool compatibility fix
        run: python -m pip install --upgrade "setuptools>=68,<74" wheel swig
      - name: Build Box2D from source with the existing NumPy and Cython
        run: python -m pip install --no-build-isolation --no-cache-dir --no-binary=box2d-py box2d-py==2.3.8
      - run: python -m pip install --no-build-isolation .
      - name: Check the legacy module, preserved NumPy and installed environment
        run: |
          python - <<'PY'
          import numpy, setuptools
          from distutils.msvccompiler import get_build_version
          import car_racing_obstacles, gymnasium as gym
          assert numpy.__version__ == "1.23.5"
          assert int(setuptools.__version__.split('.')[0]) < 74
          env = gym.make("CarRacingObstacles-v3", render_mode="rgb_array")
          observation, _ = env.reset(seed=123)
          assert observation.shape == (96, 96, 3)
          env.step(env.action_space.sample())
          env.close()
          PY
